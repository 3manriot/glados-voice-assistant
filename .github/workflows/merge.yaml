---
name: Pull Request

on:
  push:
    branches:
      - master

jobs:
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yaml
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      run_number: ${{ github.run_number }}
      push_image: true
