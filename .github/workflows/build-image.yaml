---
name: Build Wyoming Piper GLaDOS Image

on:
  workflow_call:
    inputs:
      run_number:
        description: 'GitHub run number for tagging the image'
        required: true
        type: string
      push_image:
        description: 'Whether to push the built image to the registry'
        required: false
        type: boolean
        default: false

env:
  IMAGE_NAME: wyoming-piper-glados
  DOCKER_REGISTRY: ghcr.io
  IMAGE_REF: ghcr.io/${{ github.repository_owner }}/wyoming-piper-glados

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract piper version from Dockerfile
        id: piper-version
        run: |
          mapfile -t MATCHES < <(grep -oP '(?<=rhasspy/wyoming-piper:)\S+' Dockerfile)
          if [[ ${#MATCHES[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one rhasspy/wyoming-piper reference in Dockerfile, found ${#MATCHES[@]}"
            exit 1
          fi
          printf 'version=%s\n' "${MATCHES[0]}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ inputs.push_image }}
          tags: |
            ${{ env.IMAGE_REF }}:latest
            ${{ env.IMAGE_REF }}:${{ steps.piper-version.outputs.version }}-${{ inputs.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
